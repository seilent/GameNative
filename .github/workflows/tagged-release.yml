name: Create tagged prerelease

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          mkdir -p app/keystores
          echo "$KEYSTORE" | base64 --decode > app/keystores/keystore
          echo "storeFile=keystores/keystore" >> app/keystores/keystore.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> app/keystores/keystore.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> app/keystores/keystore.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> app/keystores/keystore.properties

      - name: Configure Production Keystore
        env:
          PROD_KEYSTORE: ${{ secrets.PROD_KEYSTORE }}
          PROD_KEYSTORE_KEY_ALIAS: ${{ secrets.PROD_KEYSTORE_KEY_ALIAS }}
          PROD_KEYSTORE_KEY_PASSWORD: ${{ secrets.PROD_KEYSTORE_KEY_PASSWORD }}
          PROD_KEYSTORE_STORE_PASSWORD: ${{ secrets.PROD_KEYSTORE_STORE_PASSWORD }}
        run: |
          mkdir -p app/keystores
          echo "$PROD_KEYSTORE" | base64 --decode > app/keystores/prod.keystore
          cat <<EOF > app/keystores/prod-keystore.properties
          keyAlias=$PROD_KEYSTORE_KEY_ALIAS
          keyPassword=$PROD_KEYSTORE_KEY_PASSWORD
          storePassword=$PROD_KEYSTORE_STORE_PASSWORD
          EOF

      - name: Inject credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          CLOUD_PROJECT_NUMBER: ${{ secrets.CLOUD_PROJECT_NUMBER }}
        run: |
          : > local.properties
          add_prop() {
            local value
            value="$(printf '%s' "$2" | tr -d '\r\n"\\')"
            if [ -n "$value" ]; then echo "$1=$value" >> local.properties; fi
          }
          add_prop POSTHOG_API_KEY "$POSTHOG_API_KEY"
          add_prop POSTHOG_HOST "$POSTHOG_HOST"
          add_prop STEAMGRIDDB_API_KEY "$STEAMGRIDDB_API_KEY"
          add_prop CLOUD_PROJECT_NUMBER "$CLOUD_PROJECT_NUMBER"

      - name: Install Android SDK Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Build with Gradle
        run: ./gradlew :app:assembleLegacyRelease

      - name: Stage APK
        run: |
          cp app/build/outputs/apk/legacy/release/app-legacy-release.apk universal.apk

      - name: Sign modern APK
        env:
          KS_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KS_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/34.0.0"
          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          fi
          if [ -s app/keystores/keystore ] && [ -n "$KS_ALIAS" ]; then
            echo "Signing with configured release keystore."
            KS="app/keystores/keystore"; ALIAS="$KS_ALIAS"; STORE_PASS="$KS_STORE_PASS"; KEY_PASS="$KS_KEY_PASS"
          else
            echo "No release keystore secret set; signing with a debug keystore."
            KS="$HOME/.android/debug.keystore"; ALIAS="androiddebugkey"; STORE_PASS="android"; KEY_PASS="android"
            if [ ! -f "$KS" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
                -storepass android -keypass android -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "$KS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$ALIAS" \
            --out universal-signed.apk universal.apk
          mv universal-signed.apk universal.apk

      - name: Upload APKs for next job
        uses: actions/upload-artifact@v4
        with:
          name: universal-apk
          path: |
            universal.apk

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: universal-apk
          path: ./

      - name: Rename APKs
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mv universal.apk "gamenative-$TAG.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          body: |
            ## Highlights

            ### Glassmorphism UI
            - Full glass redesign: frosted translucent panels over a single app-wide blurred backdrop driven by the highlighted game, with a per-game dynamic accent colour.
            - Library grid/list, app detail page, install & manager dialogs (Steam/Epic/Amazon/Workshop), settings, dropdowns, config dialog and in-game overlays converted to glass; Material surface colours removed.
            - Smoother library: removed redundant loading-placeholder layers and sped up large-library scrolling.
            - Empty collection tabs (e.g. Favorites/VR with no games) are now hidden.

            ### Frame Generation (LSFG)
            - Real-frame cap with honest on-screen FPS, plus a per-game configurable real-frame cap.
            - Reduced frame-generation judder via midpoint frame pacing and host-side vsync pacing for the SurfaceFlinger renderer.
            - Default flow scale tuned to 0.30.

            ## Download
            - **`gamenative-${{ github.ref_name }}.apk`** — full build with external SD/USB storage support.
          files: |
            gamenative-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
